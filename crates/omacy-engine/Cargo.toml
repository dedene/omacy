[package]
name = "omacy-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "omacy_engine"
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.45"
tiny-skia = "0.11"
ttfx = { path = "../../vendor/ttfx" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
