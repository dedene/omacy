[workspace]
members = ["crates/omacy-engine", "tools/xtask"]
exclude = ["vendor/ttfx"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/dedene/omacy"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
