name: engine

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Engine tests
        run: cargo test -p omacy-engine
      - name: Vendored ttfx tests
        run: cargo test --manifest-path vendor/ttfx/Cargo.toml
